<section class="max-w-6xl mx-auto px-4 py-12 w-full">
  <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Servicios</h1>
    <select
      (change)="setCategory($event)"
      class="px-3 py-2 rounded-md border border-slate-300 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
    >
      <option value="">Todas las categorías</option>
      @for (cat of categories(); track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </div>

  @if (filteredServices().length === 0) {
    <div class="text-center py-20 space-y-3">
      <i class="ti ti-mood-empty text-5xl text-slate-300"></i>
      <p class="font-semibold text-slate-700">No hay servicios en esta categoría</p>
    </div>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (service of filteredServices(); track service.id) {
        <app-service-card [service]="service" />
      }
    </div>
  }
</section>
