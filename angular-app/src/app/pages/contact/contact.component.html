<main class="flex-grow container mx-auto px-6 py-12 md:py-16 max-w-4xl">
  <!-- Page Title and Description -->
  <section class="mb-10">
    <h1 class="text-3xl font-bold mb-4">Contacto</h1>
    <p class="text-slate-600">
      Envíanos un mensaje y nos pondremos en contacto contigo lo antes posible.
    </p>
  </section>

  <!-- Contact Form Card -->
  <section class="flex justify-center">
    <div class="bg-slate-100 p-8 rounded-lg shadow-sm w-full max-w-lg">
      <form (submit)="enviarMensaje($event)" class="space-y-6">
        <!-- Name Field -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1" for="nombre">Nombre:</label>
          <input 
            class="w-full border-slate-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 bg-white"
            id="nombre" 
            name="nombre" 
            required 
            type="text" 
          />
        </div>

        <!-- Email Field -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1" for="email">Email:</label>
          <input 
            class="w-full border-slate-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 bg-white"
            id="email" 
            name="email" 
            required 
            type="email" 
          />
        </div>

        <!-- Message Field -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1" for="mensaje">Mensaje:</label>
          <textarea
            class="w-full border-slate-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 bg-white"
            id="mensaje" 
            name="mensaje" 
            required 
            rows="6"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button
            class="bg-blue-500 text-white font-bold py-2 px-6 rounded-md hover:bg-blue-700 transition duration-200"
            type="submit"
          >
            Enviar Mensaje
          </button>
        </div>
      </form>
    </div>
  </section>
</main>

<!-- Show Modal -->
@if (showModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60">
    <div class="bg-white rounded-lg shadow-xl max-w-xl w-full mx-4 p-10 text-center flex flex-col items-center">
      <h2 class="text-3xl font-bold mb-6">¡Mensaje Enviado!</h2>
      <p class="text-slate-600 mb-8 text-lg">
        Gracias por contactarnos. Hemos recibido tu mensaje y te responderemos a la brevedad.
      </p>
      <button 
        class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-8 py-2.5 rounded transition duration-200" 
        (click)="closeModal()"
      >
        Cerrar
      </button>
    </div>
  </div>
}
