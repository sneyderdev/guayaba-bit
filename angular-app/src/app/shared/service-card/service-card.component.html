<article class="rounded-lg border border-slate-200 bg-white shadow-sm overflow-hidden flex flex-col h-full">
  @if (service().image) {
    <div class="aspect-16/10 bg-slate-100 overflow-hidden">
      <img [src]="service().image" alt="" class="w-full h-full object-cover" loading="lazy" />
    </div>
  }
  <div class="p-5 flex flex-col gap-3 flex-1">
    <p class="text-xs font-semibold uppercase tracking-wide text-emerald-600">
      {{ service().category }}
    </p>
    <h3 class="text-lg font-bold text-slate-900">{{ service().title }}</h3>
    <p class="text-slate-600 text-sm leading-relaxed flex-1 line-clamp-3">
      {{ service().shortDescription }}
    </p>
    @if (service().priceLabel.trim()) {
      <p class="text-sm font-medium text-slate-800">{{ service().priceLabel }}</p>
    }
    <div class="pt-1 flex flex-col gap-2">
      <app-favorite-button [serviceId]="service().id" />
      <a
        [routerLink]="['/services', service().id]"
        class="inline-flex justify-center w-full px-4 py-2 rounded-md bg-emerald-500 text-white text-sm font-semibold hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
      >Ver más</a>
    </div>
  </div>
</article>
