<header class="bg-slate-900 text-white shrink-0">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <a routerLink="/" class="text-lg font-bold text-white tracking-tight">Guayaba Bit</a>
    <nav class="flex flex-wrap items-center gap-1" aria-label="Principal">
      <a
        routerLink="/"
        routerLinkActive="bg-slate-800 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800/80"
      >Inicio</a>
      <a
        routerLink="/services"
        routerLinkActive="bg-slate-800 text-white"
        ariaCurrentWhenActive="page"
        class="px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800/80"
      >Servicios</a>
      <a
        routerLink="/favorites"
        routerLinkActive="bg-slate-800 text-white"
        ariaCurrentWhenActive="page"
        class="px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800/80"
      >Favoritos</a>
      <a
        routerLink="/contact"
        routerLinkActive="bg-slate-800 text-white"
        ariaCurrentWhenActive="page"
        class="px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800/80"
      >Contacto</a>
      <a
        routerLink="/admin/services"
        routerLinkActive="bg-slate-800 text-white"
        ariaCurrentWhenActive="page"
        class="px-3 py-2 rounded-md text-sm font-medium text-slate-200 hover:text-white hover:bg-slate-800/80"
      >Administrar</a>
    </nav>
  </div>
</header>

<main class="flex-1">
  <router-outlet />
</main>

<footer class="bg-slate-900 text-white shrink-0 mt-auto">
  <div class="max-w-6xl mx-auto px-4 py-10 text-center space-y-3 text-sm">
    <p class="text-slate-100">
      © 2026 Guayaba Bit S.A.S. Todos los derechos reservados.
    </p>
    <p class="text-slate-300">
      Carrera 11 #82-01, Oficina 1405 · Chapinero Norte · Bogotá D.C. · Colombia
    </p>
    <p class="text-slate-300">
      Tel.
      <a href="tel:+576017943062" class="hover:text-white underline-offset-2 hover:underline">
        +57 601 794 3062
      </a>
      ·
      <a href="mailto:hola@guayababit.co" class="hover:text-white underline-offset-2 hover:underline">
        hola@guayababit.co
      </a>
    </p>
    <p class="pt-4 border-t border-slate-800">
      <a routerLink="/admin/services" class="text-slate-500 hover:text-slate-300 text-xs">
        Administración de servicios
      </a>
    </p>
  </div>
</footer>
